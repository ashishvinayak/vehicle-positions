services:
  kafka:
    image: apache/kafka:latest
    container_name: shop-kafka
    ports:
      - "9092:9092"

  postgres:
      image: postgres:16
      container_name: postgres
      environment:
        POSTGRES_USER: app
        POSTGRES_PASSWORD: app
        POSTGRES_DB: vehicles
      ports:
        - "5432:5432"
